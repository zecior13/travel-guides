function buildMonthGrid(container,onSelect,initial){container.innerHTML="";for(let m=1;m<=12;m++){const chip=document.createElement("div");chip.className="month-chip"+(m===currentMonth?" now":"")+(m===initial?" active":"");chip.textContent=MONTH_NAMES[m-1];chip.addEventListener("click",()=>{[...container.children].forEach(c=>c.classList.remove("active"));chip.classList.add("active");onSelect(m)});container.appendChild(chip)}}
function status(e,m){if(e[2].includes(m))return"ideal";if(e[3].includes(m))return"alt";return"no"}

let selectedCountryMonth=currentMonth;
